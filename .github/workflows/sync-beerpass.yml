# Mantém este repositório em dia com o privado da Beerpass (ver scripts/sync-from-beerpass.sh).
name: Sincroniza com a Beerpass

on:
  schedule:
    - cron: '17 9 * * *' # todo dia, 06:17 em Brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-beerpass
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Instala git-filter-repo e gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          pip install --quiet git-filter-repo==2.47.0
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum -c -
          sudo tar -xzf "$tarball" -C /usr/local/bin gitleaks

      - name: Sincroniza
        env:
          BEERPASS_DEPLOY_KEY: ${{ secrets.BEERPASS_DEPLOY_KEY }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          scripts/sync-from-beerpass.sh --push
