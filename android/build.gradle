import com.android.Version

buildscript {
  // Buildscript is evaluated before everything else so we can't use getExtOrDefault
  def kotlin_version = rootProject.ext.has("kotlinVersion") ? rootProject.ext.get("kotlinVersion") : project.properties["kotlinVersion"]

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:7.4.2"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
  }
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties[name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties[name]).toInteger()
}

static def supportsNamespace() {
  def parsed = Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
  def major = parsed[0].toInteger()
  def minor = parsed[1].toInteger()

  // Namespace support was added in 7.3.0
  return (major == 7 && minor >= 3) || major >= 8
}

android {
  if (supportsNamespace()) {
    namespace "com.mesmart"

    sourceSets {
      main {
        manifest.srcFile "src/main/AndroidManifestNew.xml"
      }
    }
  }

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_11
    targetCompatibility JavaVersion.VERSION_11
  }

  repositories {
    flatDir {
      dirs 'libs'
    }
  }
}

repositories {
  def localProp = new Properties()
  def fileName = 'local.properties'
  localProp.load(new FileInputStream(rootProject.file(fileName)))
  def stoneToken = System.env.PACKAGECLOUD_READ_TOKEN != null ? System.env.PACKAGECLOUD_READ_TOKEN : localProp["packageCloudReadToken"] ?: ""

  mavenCentral()
  google()
  maven { url 'https://github.com/pagseguro/PlugPagServiceWrapper/raw/master' }
  maven { url "https://packagecloud.io/priv/${stoneToken}/stone/pos-android/maven2" }
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
  implementation fileTree(dir: 'libs', include: ['*.jar'])
  implementation "com.facebook.react:react-android:0.75.0-rc.5"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
  implementation "br.com.uol.pagseguro.plugpagservice.wrapper:wrapper:1.35.0"
  implementation "com.google.code.gson:gson:2.10.1"
  implementation "br.com.stone:stone-sdk:$stone_sdk_version"
  implementation "br.com.stone:stone-sdk-posandroid:$stone_sdk_version"
  implementation "br.com.stone:stone-sdk-posandroid-sunmi:$stone_sdk_version"
  compileOnly(
    name: "paystore-api-v2.11.7.31",
    ext: "aar",
    version: "v2.11.7.31",
    group: "paystore"
  )
  compileOnly(
    name: "android-easy-layer-gpos780-2.1.4-debug",
    ext: "aar",
    version: "v2.1.4",
    group: "gpos780"
  )
  compileOnly(
    name: "libgedi-1.16.21-gpos780-payment-release",
    ext: "aar",
    version: "v1.16.21",
    group: "gpos780"
  )
}
