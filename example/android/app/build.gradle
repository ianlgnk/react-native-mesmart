apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    debuggableVariants = ["pagbankDebug", "sunmiDebug", "tectoyDebug"]
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.mesmartexample"
    defaultConfig {
        applicationId "com.mesmartexample"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        ndk {
          abiFilters "armeabi-v7a"
        }
    }

    // Um APK por POS (padrao da Stone): na 4.20 os HALs Sunmi e Tectoy nao cabem no mesmo APK.
    // pagbank nao leva HAL da Stone (GPOS780 usa Gertec + PlugPag).
    flavorDimensions = ["pos"]
    productFlavors {
        pagbank {}
        sunmi {}
        tectoy {}
    }

    // Exigido pelo SDK Stone 4.20 (auth, invoice, activation).
    compileOptions {
        coreLibraryDesugaringEnabled true
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    packagingOptions {
      jniLibs {
        useLegacyPackaging true
      }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")
    sunmiImplementation("br.com.stone:stone-sdk-posandroid-sunmi:${rootProject.ext.stone_sdk_version}")
    tectoyImplementation("br.com.stone:stone-sdk-posandroid-tectoy:${rootProject.ext.stone_sdk_version}")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    implementation fileTree(dir: 'libs', include: ['*.aar'])
}
