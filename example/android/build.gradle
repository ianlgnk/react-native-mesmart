buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        // SDK Stone 4.20 exige compileSdk 35, AGP >= 8.6 e Kotlin >= 2.1 (deps compiladas em 2.2);
        // RN 0.80 e o primeiro com Kotlin 2.1.
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
        // Lido pela lib e pelos HALs dos flavors do app.
        stone_sdk_version = "4.20.16"

        localProp = new Properties()
        fileName = 'local.properties'
        localProp.load(new FileInputStream(rootProject.file(fileName)))
        stoneToken = System.env.PACKAGECLOUD_READ_TOKEN != null ? System.env.PACKAGECLOUD_READ_TOKEN : (localProp["packageCloudReadToken"] ?: "")
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

allprojects {
    repositories {
        mavenCentral()
        // So o PlugPag mora aqui; o GitHub responde 504 pra artefatos ausentes e o Gradle aborta.
        maven {
          url 'https://github.com/pagseguro/PlugPagServiceWrapper/raw/master'
          content { includeGroupByRegex 'br\\.com\\.uol\\.pagseguro.*' }
        }
        maven { url "https://packagecloud.io/priv/${stoneToken}/stone/pos-android/maven2" }
        google()
    }
}

apply plugin: "com.facebook.react.rootproject"
