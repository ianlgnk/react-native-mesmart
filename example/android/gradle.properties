# Deps do SDK Stone 4.20 estouram o heap padrao no Jetifier.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m

android.useAndroidX=true
# Algumas AARs de POS (Pax/Paystore/Gertec) ainda referenciam android.support.
android.enableJetifier=true

# As POS suportadas sao armeabi-v7a.
reactNativeArchitectures=armeabi-v7a

# Os modulos nativos da lib sao da arquitetura antiga.
newArchEnabled=false

hermesEnabled=true
